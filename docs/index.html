<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>두도 포인트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 바다색 헤더 → 오늘 조건 → [섬 지도 | 순위] 2단 (좁으면 1단) → 선택 포인트 시간별 상세 */
:root{
  --abyss:#08223a; --deep:#0d3a5c; --tide:#0e7c8c; --shallow:#5fc6c9; --foam:#f2fbfc; --coral:#ff6f45;
  --bg:#eef4f6; --surface:#ffffff; --surface2:#e1edf1; --fg:#0b2236; --muted:#557083; --line:#cddde3;
  --good:#16a06a; --mid:#d99a00; --bad:#d6493b; --rock:#8a8572; --rockfill:#c9c2a8; --sea:#d4e8ee;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061827; --surface:#0c2740; --surface2:#123452; --fg:#e6f3f6; --muted:#9db8c6; --line:#1f4766;
  --rock:#b9b39a; --rockfill:#3c4a4f; --sea:#0a3049; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061827; --surface:#0c2740; --surface2:#123452; --fg:#e6f3f6; --muted:#9db8c6; --line:#1f4766;
  --rock:#b9b39a; --rockfill:#3c4a4f; --sea:#0a3049; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.top{background:linear-gradient(180deg,var(--deep),var(--abyss));color:var(--foam);padding-block:20px 34px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:var(--bg);
  -webkit-mask:radial-gradient(28px 12px at 50% 0,transparent 98%,#000) 0 0/56px 22px repeat-x;mask:radial-gradient(28px 12px at 50% 0,transparent 98%,#000) 0 0/56px 22px repeat-x}
.toprow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,40px);letter-spacing:.5px;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--shallow);font-size:13px;margin-top:4px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--foam);font:700 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--foam);color:var(--abyss)}
.seg button:focus-visible,.btn:focus-visible,.prow:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.cond{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:18px}
.stat{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;min-width:0}
.stat .k{font-size:11px;color:rgba(242,251,252,.7);letter-spacing:.3px}
.stat .v{font:600 18px var(--f-num);font-variant-numeric:tabular-nums}
.stat .v small{font:500 12px var(--f-body);color:rgba(242,251,252,.75)}
.tidebar{margin-top:14px}
.tidebar svg{width:100%;height:70px;display:block}
.tideticks{display:flex;justify-content:space-between;font:500 10px var(--f-num);color:rgba(242,251,252,.7)}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:18px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 13px var(--f-body);padding:7px 12px;border-radius:999px;cursor:pointer}
.manual{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.manual label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.manual output{font:600 14px var(--f-num);color:var(--fg);float:right}
.manual input[type=range]{width:100%;accent-color:var(--tide)}
.manual select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:14px var(--f-body)}
.spchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.spchips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:6px 13px;border-radius:999px;cursor:pointer}
.spchips button[aria-pressed="true"]{background:var(--tide);border-color:var(--tide);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;margin-top:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.panel h2{font:700 16px var(--f-body);margin:0 0 4px}
.panel .hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.mapbox{position:relative}
#map{width:100%;height:auto;display:block;border-radius:12px;background:var(--sea)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.list{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:26px 50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;color:inherit;font:inherit;width:100%}
.prow:hover{background:var(--surface2)}
.prow[aria-current="true"]{border-color:var(--tide);background:var(--surface2)}
.rank{font:600 13px var(--f-num);color:var(--muted);text-align:center}
.gauge{width:50px;height:50px}
.pname{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;color:var(--tide);background:color-mix(in srgb,var(--tide) 14%,transparent);padding:1px 6px;border-radius:6px}
.tag.ebb{color:#7a5bd0;background:color-mix(in srgb,#7a5bd0 14%,transparent)}
.tag.flood{color:var(--tide)}
.tag.both{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:2px;align-items:flex-end;height:26px}
.bars i{display:block;width:7px;border-radius:2px}
.detail{margin-top:18px}
.dhead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.dhead .big{width:86px;height:86px}
.dname{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1.1}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;background:var(--surface2);border-radius:9px;padding:4px 9px}
.pill b{font-weight:700}
.hours{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:14px}
.hcol{border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;text-align:center;cursor:pointer;background:var(--surface);color:inherit;font:inherit}
.hcol[aria-pressed="true"]{border-color:var(--tide);background:var(--surface2)}
.hcol .h{font:600 12px var(--f-num)}
.hcol .tank{height:70px;margin:6px auto;width:60%;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden}
.hcol .tank i{position:absolute;left:0;right:0;bottom:0;border-radius:6px}
.hcol .s{font:600 15px var(--f-num)}
.hcol .ph{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reasons{margin-top:14px;display:flex;flex-direction:column;gap:5px}
.reason{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:14px}
.reason .d{width:8px;height:8px;border-radius:50%;align-self:center}
.reason .n{font:600 13px var(--f-num)}
.sum{font-size:12px;color:var(--muted);margin-top:10px}
.foot{font-size:12px;color:var(--muted);margin-top:22px;max-width:70ch}
.danger{color:var(--bad);font-weight:700;font-size:13px}
@media (prefers-reduced-motion:no-preference){.hcol .tank i,.bars i{transition:height .35s ease}}
@media (max-width:520px){.hours{grid-template-columns:repeat(4,minmax(0,1fr))}.prow{grid-template-columns:22px 44px minmax(0,1fr)}.prow .bars{grid-column:3}.gauge{width:44px;height:44px}}
</style>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <div>
        <h1>두도 포인트</h1>
        <div class="sub">부산 송도 두도 갯바위 찌낚시 · 05~13시 평균 확률 순위</div>
      </div>
      <div class="seg" role="group" aria-label="날짜">
        <button type="button" data-day="0" aria-pressed="true">오늘</button>
        <button type="button" data-day="1" aria-pressed="false">내일</button>
        <button type="button" data-day="2" aria-pressed="false">모레</button>
      </div>
    </div>
    <div class="cond" id="cond"></div>
    <div class="tidebar">
      <svg id="tideSvg" viewBox="0 0 480 70" preserveAspectRatio="none" aria-label="하루 물때 곡선"></svg>
      <div class="tideticks"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>24시</span></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status"></div>
  <div class="manual" id="manual" hidden>
    <div><label for="inWind">풍속 <output id="oWind"></output></label><input type="range" id="inWind" min="0" max="14" step="0.5"></div>
    <div><label for="inDir">바람 방향 (불어오는 쪽)</label>
      <select id="inDir"><option value="0">북</option><option value="45">북동</option><option value="90">동</option><option value="135">남동</option><option value="180">남</option><option value="225">남서</option><option value="270">서</option><option value="315">북서</option></select></div>
    <div><label for="inWave">외해 파고 <output id="oWave"></output></label><input type="range" id="inWave" min="0" max="3" step="0.1"></div>
    <div><label for="inTemp">수온 <output id="oTemp"></output></label><input type="range" id="inTemp" min="8" max="28" step="0.5"></div>
  </div>
  <div class="spchips" id="spchips" role="group" aria-label="대상어"></div>

  <div class="grid">
    <section class="panel">
      <h2>섬 지도</h2>
      <p class="hint">원 안 번호 = 포인트, 색 = 05~13시 평균 확률. 원을 누르면 시간별 근거가 나와요.</p>
      <div class="mapbox"><svg id="map" viewBox="0 0 400 520" role="img" aria-label="두도 포인트 지도"></svg></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--coral)"></i>75↑ 강력 추천</span>
        <span><i class="dot" style="background:var(--good)"></i>62↑ 좋음</span>
        <span><i class="dot" style="background:var(--mid)"></i>45↑ 보통</span>
        <span><i class="dot" style="background:var(--bad)"></i>비추천</span>
      </div>
    </section>
    <section class="panel">
      <h2>추천 순위</h2>
      <p class="hint">막대 8개 = 05·06·…·12시 확률</p>
      <div class="list" id="list"></div>
    </section>
  </div>

  <section class="panel detail" id="detail"></section>

  <p class="foot" id="foot">점수는 물때·조류 방향·바람·체감 파고·수온·포인트 수심과 지형·과거 조과(인낚 조행기, 송도 은파낚시 밴드 조황)로 계산한 참고값입니다. 갯바위 출조 전 기상특보와 현장 상황을 꼭 확인하세요.</p>
</main>

function tidesEstimate(ds){

function distM(a,b){return Math.hypot((a.lat-b.lat)*111320,(a.lng-b.lng)*111320*Math.cos(a.lat*Math.PI/180))}
function pointWeight(p,r){
  if(r.pointId){
    if(r.pointId===p.id)return 1;
    const q=BYID[r.pointId]; if(!q)return 0;
    const d=distM(q,p);
    return d<=35&&ang(q.facingDeg,p.facingDeg)<=50?.45:d<=70&&q.terrain===p.terrain?.2:0;
  }
  return ang(r.sideFacingDeg,p.facingDeg)<=50?.5:0;
}
function historyReasons(p,sp,cond,h){
  let total=0,count=0,best=null,poorT=0,poorN=0; const out=[];
  for(const r of RECORDS){
    if(!isPointRec(r))continue;
    const poor=(r.rating||{})[sp]<0, n=r.catches[sp];
    if(n==null||(n<=0&&!poor))continue;
    const pw=pointWeight(p,r); if(pw<=0)continue;
    const sim=similarity(r,cond,h); if(sim<=0)continue;
    if(poor){if(sim*pw>=.05){poorT+=sim*pw;poorN++}continue}
    const c=sim*pw*Math.log(1+n)/Math.log(16); if(c<.05)continue;
    total+=c;count++; if(!best||c>best[1])best=[r,c];
  }
  if(best){
    const r=best[0]; const where=r.pointId===p.id?"이 자리":r.pointId?(BYID[r.pointId]?.name.replace("두도 ","")||"인접 자리"):compass(r.sideFacingDeg)+"편";
    out.push([`비슷한 물때 조과 ${count}건 (예: ${r.date} ${where})`,Math.max(2,Math.min(18,r0(total*14)))]);
  }
  if(poorN)out.push([`비슷한 물때에 이쪽 부진 기록 ${poorN}건`,-Math.max(2,Math.min(8,r0(poorT*12)))]);
  return out;
}
function dayReason(sp,cond,h){
  let good=0,poor=0,ng=0,np=0;
  for(const r of RECORDS){
    if(isPointRec(r))continue;
    const isPoor=(r.rating||{})[sp]<0, n=r.catches[sp];
    if(n==null||(n<=0&&!isPoor))continue;
    const sim=similarity(r,cond,h); if(sim<.25)continue;
    if(isPoor){poor+=sim;np++}else{good+=sim*Math.log(1+n)/Math.log(13);ng++}
  }
  if(!ng&&!np)return null;
  return [`두도 전체 – 비슷한 물때 날 조황 (좋음 ${ng}일 · 부진 ${np}일)`,Math.max(-8,Math.min(10,r0((good-poor*.9)*4)))];
}

// ───────── 시간별 점수 ─────────
const toScore=sum=>Math.max(1,Math.min(99,Math.round(100/(1+Math.exp(-(sum-44)/13)))));
function scoreHour(p,sp,cond,h){
  const S=SPECIES[sp], prof=profile(p), R=[]; let danger=null;
  const w=cond.weather[h]||cond.weather.def;
  const wind=w.wind, wdir=w.dir, sea=w.wave, t=cond.temp;
  const on=ang(wdir,p.facingDeg)<=60;
  let wave=null;
  if(sea!=null){wave=sea*(.35+.65*prof.exposure); if(wind>=4)wave*=on?1.15:.85; wave=Math.floor(wave*10)/10}
  // 계절
  const season=S.season[cond.month-1];
  R.push([`${sp} 시즌 ${"★".repeat(season)}${"☆".repeat(3-season)}`,r0((season-1.5)*7)]);
  const mid=(S.ideal[0]+S.ideal[1])/2, half=(S.ideal[1]-S.ideal[0])/2+2;
  R.push([`수온 ${t.toFixed(1)}°C (적정 ${S.ideal[0]}~${S.ideal[1]}°C)`,r0(Math.exp(-(((t-mid)/half)**2))*18-8)]);
  if(cond.tempChange!=null){const d=cond.tempChange;
    if(d>=.3)R.push([`수온 상승 ${d>0?"+":""}${d.toFixed(1)}°C – 활성 오름`,5]);
    else if(d<=-1.5)R.push([`수온 급락 ${d.toFixed(1)}°C`,-8]); else if(d<=-.5)R.push([`수온 하락 ${d.toFixed(1)}°C`,-4]);}
  const pref=preferredDepth(sp,t), fit=depthFit(p,pref);
  R.push([`수심 ${p.depth} · 지금 수온 선호 ${pref[0]}~${pref[1]}m ${fit>=.6?"(맞음)":fit>.2?"(일부)":"(벗어남)"}`,r0(fit*14-5)]);
  const tf=terrainFit(p,sp,t); if(tf)R.push(tf);
  if(!p.species.includes(sp))R.push(["이 자리 대표 어종 아님",-8]);
  // 물때·조류
  const at=kstMs(cond.date,h,30), ts=tideState(at,cond.tides);
  const st=ts?strengthOf(ts,cond.rf):.3;
  let phase="정보 없음";
  if(ts){
    phase=`${ts.incoming?"들물":"날물"} ${r0(ts.progress*100)}%`;
    if(ts.nearSlack){
      const which=(ts.progress<.5)===ts.prevHigh?"만조":"간조";
      R.push(sp==="감성돔"?[`${which} 물돌이 – 대물 입질 시간 (밴드 조황)`,9]:sp==="벵에돔"?[`${which} 정조 – 벵에는 조류가 있어야`,-4]:[`${which} 물돌이`,2]);
    }else{
      const suit=ts.incoming?prof.flood:prof.ebb, power=Math.max(.3,Math.min(1,st/.5));
      const how=suit>=.9?"조류가 공략 지점으로 뻗어 나감":suit>=.75?"섬 하류 쪽 조경지대":suit>=.5?"갯바위 따라 흐름":suit>0?"홈통 안으로 도는 물":"갯바위로 받혀 채비가 밀려옴";
      R.push([`${phase} – ${how} (${prof.type})`,r0(suit*14*power)]);
      if(sp==="감성돔"&&ts.incoming&&ts.progress>=.4)R.push(["중들물~끝들물",5]);
      if(sp==="벵에돔"&&ts.progress>=.25&&ts.progress<=.75)R.push(["조류 활발한 중간 물때",4]);
      if(st>.65&&p.terrain==="곶부리"&&suit<.85)R.push(["센 조류 – 곶부리 정면은 너무 빠름",-4]);
      if(st>.65&&p.terrain==="홈통")R.push(["센 조류 – 홈통 반탄류",4]);
      if(st<.3&&p.terrain==="곶부리")R.push(["약한 조류 – 물이 가는 곶부리 유리",4]);
    }
  }
  const f=cond.rf;
  R.push(f<.2?[`${cond.mul} – 조류 거의 없음`,-6]:f>=.35&&f<=.8?[`${cond.mul} – 적당한 조류`,5]:f>.9?[`${cond.mul} – 사리, 조류 강함`,p.depthMax>=10?1:-3]:[cond.mul,1]);
  // 빛
  const sr=h*60+30-cond.sunrise;
  if(sp==="감성돔")R.push(sr>=-60&&sr<=60?["해 뜰 무렵 피딩타임",10]:sr>60&&sr<=150?["아침 – 입질 이어짐",5]:h>=11?["한낮 – 경계심 커짐",-3]:sr<-60?["해 뜨기 전",2]:["오전",0]);
  else if(sp==="벵에돔")R.push(sr<0?["해 뜨기 전 – 벵에 활성 낮음",-5]:h>=7&&h<=11?["오전 – 벵에 활성 시간",5]:["주간",2]);
  else if(sp==="볼락")R.push(sr<30?["새벽 – 볼락 활성",8]:["낮 – 볼락 활성 낮음",-10]);
  else R.push(sr>=-60&&sr<=90?["아침 피딩",8]:["주간",-2]);
  // 바람
  const dt=compass(wdir);
  if(wind>=12){danger=`강풍 ${wind.toFixed(0)}m/s`;R.push([`강풍 ${wind.toFixed(1)}m/s – 출조 위험`,-30])}
  else if(wind>=9)R.push([`${dt} ${wind.toFixed(1)}m/s – 낚시 어려움`,on?-18:-10]);
  else if(wind>=6&&on){R.push([`${dt} 맞바람 ${wind.toFixed(1)}m/s – 채비 운용 어려움`,-12]);if(wind>=8)danger="맞바람·파도 주의"}
  else if(wind>=6)R.push([`${dt} ${wind.toFixed(1)}m/s – 등지는 자리`,0]);
  else if(wind>=2.5)R.push([`${dt} ${wind.toFixed(1)}m/s – 적당한 물결`,3]);
  else R.push(["바람 거의 없음 – 잔잔하면 경계심↑",sp==="감성돔"?-4:0]);
  if(wind>=4&&wdir>=200&&wdir<=250)R.push(["남서풍 – 수온 하강·조황 저하 경향 (밴드 조황)",-3]);
  // 체감 파고
  if(wave!=null){
    const tag=`체감 파고 ${wave.toFixed(1)}m (외해 ${sea.toFixed(1)}m, ${prof.exposureText})`;
    if(wave>=2){danger=`파고 ${wave.toFixed(1)}m – 갯바위 위험`;R.push([tag+" – 위험",-30])}
    else if(wave>S.waveLimit)R.push([tag+" – 높음",-12]);
    else if(sp==="감성돔"&&wave>=.4&&wave<=1.2)R.push([tag+" – 적당한 포말",7]);
    else if(sp==="벵에돔"&&wave>=.3&&wave<=1)R.push([tag+" – 적당한 물결",4]);
    else if(wave<.3&&S.likesWave)R.push([tag+" – 너무 잔잔함",-4]);
    else R.push([tag,0]);
    if(on&&wave>=1.5&&!danger)danger="정면 너울 – 갯바위 진입 주의";
  }
  if(w.rain)R.push(["강수 예보",-3]);
  R.push(...historyReasons(p,sp,cond,h));
  const dr=dayReason(sp,cond,h); if(dr)R.push(dr);
  let score=toScore(R.reduce((s,x)=>s+x[1],0)); if(danger)score=Math.min(score,15);
  return {h,score,reasons:R,danger,phase,wind,wdir,wave};
}
const HOURS=[5,6,7,8,9,10,11,12];
function evaluate(p,sp,cond){
  const hours=HOURS.map(h=>scoreHour(p,sp,cond,h));
  const day=r0(hours.reduce((s,x)=>s+x.score,0)/hours.length);
  let bi=0;for(let i=0;i<hours.length-1;i++)if(hours[i].score+hours[i+1].score>hours[bi].score+hours[bi+1].score)bi=i;
  return {p,sp,hours,day,win:[hours[bi].h,hours[bi+1].h+1]};
}
function bestFor(p,cond,sp){
  if(sp)return evaluate(p,sp,cond);
  const c=p.species.filter(s=>SPECIES[s]); return c.map(s=>evaluate(p,s,cond)).reduce((a,b)=>b.day>a.day?b:a);
}

const LIVE={};

  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(tm)}
}

    fetchJson(`https://marine-api.open-meteo.com/v1/marine?latitude=35.035&longitude=129.03&hourly=wave_height,sea_surface_temperature,sea_level_height_msl&past_days=1&forecast_days=4${tz}`)

  const tms=s=>{const [d,t]=s.split("T");return kstMs(d,+t.slice(0,2),+t.slice(3,5))};
  LIVE.weather={};
  wx.hourly.time.forEach((s,i)=>{LIVE.weather[tms(s)]={wind:wx.hourly.wind_speed_10m[i]??0,dir:wx.hourly.wind_direction_10m[i]??0,rain:(wx.hourly.precipitation_probability[i]??0)>=60}});
  const mt=mar.hourly.time.map(tms);
  LIVE.wave={}; LIVE.sst={};
  mt.forEach((t,i)=>{LIVE.wave[t]=mar.hourly.wave_height[i];LIVE.sst[t]=mar.hourly.sea_surface_temperature[i]});
  const lv=mar.hourly.sea_level_height_msl;

  LIVE.ok=true;
}
function sstMean(ds){const v=[];for(let h=0;h<24;h++){const x=LIVE.sst[kstMs(ds,h)];if(x!=null)v.push(x)}return v.length?v.reduce((a,b)=>a+b)/v.length:null}

const today=dateStr(Date.now());
const state={day:0,sp:null,sel:null,selHour:null,mode:"manual",
  manual:{wind:3,dir:0,wave:.6,temp:MONTH_TEMP[kstParts(Date.now()).m-1]}};
try{const s=JSON.parse(localStorage.getItem("dudo-manual")||"null");if(s)Object.assign(state.manual,s)}catch(e){}

function buildCond(){
  const ds=addDays(today,state.day), age=moonAge(kstMs(ds,12));
  const cond={date:ds,month:+ds.slice(5,7),mul:mulName(ds),mulIdx:mulIndex(ds),rf:rangeFactor(age),sunrise:sunrise(ds),weather:{},tempChange:null,src:{}};
  if(state.mode==="live"&&LIVE.ok){
    for(let h=0;h<24;h++){const t=kstMs(ds,h);const w=LIVE.weather[t];if(w)cond.weather[h]={...w,wave:LIVE.wave[t]??null}}
    cond.weather.def={wind:3,dir:0,wave:null,rain:false};
    const m=sstMean(ds), y=sstMean(addDays(ds,-1));
    cond.temp=m??MONTH_TEMP[cond.month-1]; cond.tempChange=m!=null&&y!=null&&state.day===0?Math.round((m-y)*10)/10:null;
    cond.tides=LIVE.tides&&LIVE.tides.length>4?LIVE.tides:tidesEstimate(ds);
    cond.src.tide=LIVE.tides&&LIVE.tides.length>4?"해수면 예보":"천문 추정";
  }else{
    const M=state.manual;
    cond.weather.def={wind:M.wind,dir:M.dir,wave:M.wave,rain:false};
    cond.temp=M.temp; cond.tides=tidesEstimate(ds); cond.src.tide="천문 추정";
  }

const MAP={w:400,h:520};
let PROJ=null;
function project(lat,lng){
  if(!PROJ){
    const all=[...SHAPE.islands.flat(),...POINTS.map(p=>[p.lat,p.lng]),SHAPE.buoy];
    const la=all.map(x=>x[0]), ln=all.map(x=>x[1]);
    const k=Math.cos(C_LAT*Math.PI/180);
    const minX=Math.min(...ln)*k, maxX=Math.max(...ln)*k, minY=Math.min(...la), maxY=Math.max(...la);
    const pad=26, s=Math.min((MAP.w-2*pad)/(maxX-minX),(MAP.h-2*pad)/(maxY-minY));
    PROJ={k,s,ox:(MAP.w-(maxX-minX)*s)/2-minX*s,oy:(MAP.h-(maxY-minY)*s)/2+maxY*s};
  }
  return [lng*PROJ.k*PROJ.s+PROJ.ox, PROJ.oy-lat*PROJ.s];
}

    const lab=r.p.name.replace("두도 ","").replace("번","").replace("직벽","벽");
    return `<g class="pin" data-id="${r.p.id}" tabindex="0" role="button" aria-label="${r.p.name} ${r.day}점" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${scoreColor(r.day)}" stroke="#fff" stroke-width="${s?2.5:1.5}"/>
      <text x="${x}" y="${y+3.3}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="${lab.length>3?7:s?10:8.5}" font-weight="600" fill="#fff">${lab}</text></g>`}).join("");
  const n=[MAP.w-24,24];
  $("map").innerHTML=`<line x1="${bx1}" y1="${by1}" x2="${bx2}" y2="${by2}" stroke="var(--rock)" stroke-width="7" stroke-linecap="round" opacity=".7"/>${isl}
   <circle cx="${ux}" cy="${uy}" r="4" fill="var(--bad)"/><text x="${ux+7}" y="${uy+4}" font-size="10" fill="var(--muted)">부표</text>
   <text x="${n[0]}" y="${n[1]}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">N ↑</text>
   <text x="${bx2+8}" y="${by2+12}" font-size="10" fill="var(--muted)">방파제 → 송도</text>
   <text x="20" y="${MAP.h-14}" font-size="11" fill="var(--muted)">↓ 외해</text>
   ${aim}${pins}`;
  $("map").querySelectorAll(".pin").forEach(g=>{g.onclick=()=>select(g.dataset.id);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(g.dataset.id)}}});
}

function renderList(results){
  $("list").innerHTML=results.map((r,i)=>{
    const prof=profile(r.p);
    return `<button class="prow" type="button" data-id="${r.p.id}" aria-current="${r.p.id===state.sel}">
      <span class="rank">${i+1}</span>${gaugeSvg(r.day)}
      <span style="min-width:0"><span class="pname">${r.p.name}<span class="tag ${tagCls(prof.type)}">${prof.type}</span></span>
      <span class="pmeta" style="display:block">${r.sp} · 최고 ${String(r.win[0]).padStart(2,"0")}~${String(r.win[1]).padStart(2,"0")}시 · ${r.p.terrain} · 수심 ${r.p.depth}</span></span>
      <span class="bars" aria-hidden="true">${r.hours.map(x=>`<i style="height:${4+x.score*.22}px;background:${x.danger?"var(--bad)":scoreColor(x.score)}"></i>`).join("")}</span>
    </button>`}).join("");
  $("list").querySelectorAll(".prow").forEach(b=>b.onclick=()=>select(b.dataset.id));
}

function renderDetail(results){
  const r=results.find(x=>x.p.id===state.sel)||results[0]; if(!r){$("detail").innerHTML="";return}
  const prof=profile(r.p), bestH=r.hours.reduce((a,b)=>b.score>a.score?b:a);
  const hs=r.hours.find(x=>x.h===state.selHour)||bestH;
  const sum=hs.reasons.reduce((s,x)=>s+x[1],0);
  $("detail").innerHTML=`<div class="dhead">${gaugeSvg(r.day,86,8,true)}
    <div style="min-width:0"><div class="dname">${r.p.name}</div>
    <div class="pmeta" style="white-space:normal">${r.sp} · 05~13시 평균 ${r.day}점 · 최고 ${String(r.win[0]).padStart(2,"0")}~${String(r.win[1]).padStart(2,"0")}시</div>
    <div class="pmeta" style="white-space:normal">${r.p.target||""}</div></div></div>
    <div class="pills">
      <span class="pill">성격 <b>${prof.type}</b></span>
      <span class="pill">들물 적합 <b>${r0(prof.flood*100)}</b> · 날물 적합 <b>${r0(prof.ebb*100)}</b></span>
      <span class="pill">너울 <b>${prof.exposureText}</b></span>
      <span class="pill">공략 <b>${compass(r.p.facingDeg)}쪽 ${r.p.targetDistance}m</b></span>
      <span class="pill">수심 <b>${r.p.depth}</b></span><span class="pill">지형 <b>${r.p.terrain}</b></span>
    </div>
    <div class="hours" role="group" aria-label="시간별 확률">${r.hours.map(x=>`<button class="hcol" type="button" data-h="${x.h}" aria-pressed="${x.h===hs.h}">
      <div class="h">${String(x.h).padStart(2,"0")}시</div><div class="tank"><i style="height:${x.score}%;background:${x.danger?"var(--bad)":scoreColor(x.score)}"></i></div>
      <div class="s">${x.score}</div><div class="ph">${x.phase}</div></button>`).join("")}</div>
    <h2 style="margin-top:16px">${String(hs.h).padStart(2,"0")}~${String(hs.h+1).padStart(2,"0")}시 ${hs.score}점 근거</h2>
    ${hs.danger?`<div class="danger">⚠ ${hs.danger}</div>`:""}
    <div class="reasons">${[...hs.reasons].sort((a,b)=>b[1]-a[1]).map(([t,d])=>{const c=d>0?"var(--good)":d<0?"var(--bad)":"var(--muted)";return `<div class="reason"><span class="d" style="background:${c}"></span><span>${t}</span><span class="n" style="color:${c}">${d>0?"+":""}${d}</span></div>`}).join("")}</div>
    <div class="sum">가감 합계 ${sum>0?"+":""}${sum} → ${hs.score}점${hs.danger?" (위험 조건으로 15점 제한)":""}</div>`;
  $("detail").querySelectorAll(".hcol").forEach(b=>b.onclick=()=>{state.selHour=+b.dataset.h;renderDetail(LAST)});
}

let LAST=[];
function select(id){state.sel=id;state.selHour=null;renderMap(LAST);renderList(LAST);renderDetail(LAST);
  if(window.innerWidth<860)$("detail").scrollIntoView({behavior:"smooth",block:"start"})}

function renderSpecies(){
  const opts=[[null,"최적 어종"],...Object.keys(SPECIES).map(s=>[s,s])];
  $("spchips").innerHTML=opts.map(([v,l])=>`<button type="button" data-sp="${v??""}" aria-pressed="${state.sp===v}">${l}</button>`).join("");
  $("spchips").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.sp=b.dataset.sp||null;render()});
}

function syncManual(){
  const M=state.manual;
  $("inWind").value=M.wind;$("oWind").textContent=`${M.wind} m/s`;
  $("inDir").value=String(M.dir);
  $("inWave").value=M.wave;$("oWave").textContent=`${(+M.wave).toFixed(1)} m`;
  $("inTemp").value=M.temp;$("oTemp").textContent=`${(+M.temp).toFixed(1)} °C`;
}
[["inWind","wind"],["inDir","dir"],["inWave","wave"],["inTemp","temp"]].forEach(([id,k])=>{
  $(id).addEventListener("input",e=>{state.manual[k]=+e.target.value;try{localStorage.setItem("dudo-manual",JSON.stringify(state.manual))}catch(_){}syncManual();render()});
});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});

function render(){
  const cond=buildCond();
  renderHeader(cond);renderStatus(cond);renderSpecies();syncManual();
  LAST=POINTS.map(p=>bestFor(p,cond,state.sp)).sort((a,b)=>b.day-a.day);
  if(!state.sel||!LAST.some(r=>r.p.id===state.sel))state.sel=LAST[0].p.id;
  renderMap(LAST);renderList(LAST);renderDetail(LAST);
}
render();
loadLive().then(()=>{state.mode="live";render()}).catch(()=>{render()});
</script>

</body></html>
